<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Restore native History API when extensions patch pushState/replaceState (fixes router TypeError on dispatchEvent). -->
    <script>
      (function () {
        if (typeof window === 'undefined' || typeof document === 'undefined') return;
        try {
          var iframe = document.createElement('iframe');
          iframe.style.display = 'none';
          iframe.setAttribute('aria-hidden', 'true');
          document.documentElement.appendChild(iframe);
          var inner = iframe.contentWindow;
          if (!inner || !inner.history) {
            document.documentElement.removeChild(iframe);
            return;
          }
          var nativePush = inner.History.prototype.pushState;
          var nativeReplace = inner.History.prototype.replaceState;
          document.documentElement.removeChild(iframe);

          var h = window.history;
          h.pushState = function (state, title, url) {
            return nativePush.call(h, state, title, url);
          };
          h.replaceState = function (state, title, url) {
            return nativeReplace.call(h, state, title, url);
          };
        } catch (e) {
          console.warn('[Budget App] Could not normalize history API:', e);
        }
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light">
    <title>Budget Tracker App</title>
    <base href="/" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <script src="assets/env.js"></script>

    <link
      rel="icon"
      type="image/x-icon"
      href="./assets/img/favicon/favicon.ico"
    />

    <!-- NOTE RealFavIconGenerator -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/img/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/img/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/img/favicon/favicon-16x16.png"
    />
    <link
      rel="mask-icon"
      href="assets/img/favicon/safari-pinned-tab.svg"
      color="#5bbad5"
    />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body style="margin: 0">
    <app-root>
      <!-- Mirrors app.component.scss .layout: max-width 500px centered (mobile-first). -->
      <div
        id="app-loading-splash"
        style="
          position: fixed;
          inset: 0;
          z-index: 99999;
          margin: 0;
          background: #ffffff;
          box-sizing: border-box;
        "
      >
        <div
          style="
            max-width: 500px;
            width: 100%;
            min-height: 100vh;
            margin: 0 auto;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #4a9085;
            color: #ffffff;
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
            font-size: 1.25rem;
            font-weight: 500;
          "
        >
          Budget Tracker App
        </div>
      </div>
    </app-root>
  </body>
</html>
